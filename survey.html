<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudo sobre organização e hábitos de estudo</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}
    iframe{display:block;width:100%;height:100%;border:0;background:#f6f7fb}
  </style>
</head>
<body>
  <iframe id="surveyFrame" title="Questionário sobre organização e hábitos de estudo"></iframe>
  <script>
    const frame = document.getElementById('surveyFrame');

    async function loadSurvey(){
      const res = await fetch('/index.html?nocache=' + Date.now(), { cache: 'no-store' });
      let html = await res.text();

      // Remove definitivamente a lógica de limites ANTES de o JS original ser executado.
      html = html.replace(
        /function checks\(id,name,title,opts,max=0\)\{[\s\S]*?\}\nfunction scale/,
        `function checks(id,name,title,opts){document.getElementById(id).innerHTML='<div class="q"><span class="qlabel">'+title+'</span><div class="opts">'+opts.map(x=>'<label class="opt"><input type="checkbox" name="'+name+'" value="'+esc(x)+'"><span>'+esc(x)+'</span></label>').join('')+'</div></div>'}\nfunction scale`
      );

      // Retira a linguagem de limite da pergunta das funcionalidades essenciais.
      html = html.replace(
        'Escolhe agora até 3 funcionalidades que consideras essenciais.',
        'Quais destas funcionalidades consideras essenciais?'
      );

      // Preserva tracking ?src= / utm_source quando a página corre dentro de srcdoc.
      html = html.replace(
        'new URLSearchParams(location.search)',
        'new URLSearchParams(parent.location.search)'
      );

      frame.srcdoc = html;
    }

    loadSurvey().catch(err => {
      console.error(err);
      document.body.innerHTML = '<p style="font-family:system-ui;padding:24px">Não foi possível carregar o questionário. Atualiza a página e tenta novamente.</p>';
    });
  </script>
</body>
</html>
