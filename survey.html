<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudo sobre organização e hábitos de estudo</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}
    iframe{display:block;width:100%;height:100%;border:0;background:#f6f7fb}
  </style>
</head>
<body>
  <iframe id="surveyFrame" title="Questionário sobre organização e hábitos de estudo"></iframe>
  <script>
    const frame = document.getElementById('surveyFrame');
    frame.src = '/index.html' + window.location.search;

    function removeAllSelectionLimits(doc) {
      if (!doc) return;

      // Marca todos os grupos que antigamente tinham limite.
      doc.querySelectorAll('.max3,.max5,.max7').forEach(container => {
        container.dataset.unlimited = 'true';
        container.classList.remove('max3','max5','max7');
      });

      // Remove qualquer texto visual relacionado com limites.
      doc.querySelectorAll('.hint').forEach(el => {
        if (/máximo|no máximo|até\s+[357]/i.test(el.textContent || '')) el.remove();
      });

      doc.querySelectorAll('.qlabel').forEach(el => {
        const text = el.textContent || '';
        if (/escolhe agora.*3.*funcionalidades/i.test(text)) {
          el.textContent = 'Quais destas funcionalidades consideras essenciais?';
        }
      });

      // Clona checkboxes dos grupos antigos para eliminar listeners já adicionados.
      doc.querySelectorAll('[data-unlimited="true"] input[type="checkbox"]').forEach(input => {
        if (input.dataset.cleaned === 'true') return;
        const clone = input.cloneNode(true);
        clone.checked = input.checked;
        clone.dataset.cleaned = 'true';
        input.replaceWith(clone);
      });

      // Links de privacidade abrem na janela principal.
      doc.querySelectorAll('a[href="privacy.html"]').forEach(a => a.target = '_top');
    }

    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;

        // Corre imediatamente e repete durante alguns segundos para apanhar
        // qualquer conteúdo/listener criado pelo JavaScript do questionário.
        removeAllSelectionLimits(doc);
        let runs = 0;
        const timer = setInterval(() => {
          removeAllSelectionLimits(doc);
          runs++;
          if (runs >= 15) clearInterval(timer);
        }, 200);

        // Captura mudanças antes dos listeners antigos e impede que qualquer
        // lógica de limite volte a desmarcar opções.
        doc.addEventListener('change', event => {
          const target = event.target;
          if (target instanceof frame.contentWindow.HTMLInputElement &&
              target.type === 'checkbox' &&
              target.closest('[data-unlimited="true"]')) {
            event.stopImmediatePropagation();
          }
        }, true);
      } catch (e) {
        console.error('Não foi possível remover os limites:', e);
      }
    });
  </script>
</body>
</html>
