<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudo sobre organização e hábitos de estudo</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f7fb}
    iframe{display:block;width:100%;height:100%;border:0;background:#f6f7fb}
  </style>
</head>
<body>
  <iframe id="surveyFrame" title="Questionário sobre organização e hábitos de estudo"></iframe>
  <script>
    const frame = document.getElementById('surveyFrame');
    frame.src = '/index.html' + window.location.search;

    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;

        // Remove os limites de seleção que existiam nas perguntas de checkbox.
        ['max3','max5','max7'].forEach(cls => {
          doc.querySelectorAll('.' + cls).forEach(container => {
            container.querySelectorAll('input[type="checkbox"]').forEach(input => {
              const clone = input.cloneNode(true);
              clone.checked = input.checked;
              input.replaceWith(clone);
            });
            container.classList.remove(cls);
          });
        });

        // Remove avisos do tipo "Seleciona no máximo X".
        doc.querySelectorAll('.hint').forEach(el => {
          if (/seleciona no máximo/i.test(el.textContent || '')) el.remove();
        });

        // A pergunta que antes pedia exatamente três passa a aceitar todas as opções relevantes.
        doc.querySelectorAll('.qlabel').forEach(el => {
          if (/escolhe agora as 3/i.test(el.textContent || '')) {
            el.textContent = 'Quais destas funcionalidades consideras mais importantes?';
          }
        });

        // Links institucionais abrem fora do iframe.
        doc.querySelectorAll('a[href="privacy.html"]').forEach(a => a.target = '_top');
      } catch (e) {
        console.error('Não foi possível aplicar as opções sem limite:', e);
      }
    });
  </script>
</body>
</html>
